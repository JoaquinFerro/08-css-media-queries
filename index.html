<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/c8964b1cc3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>AutoElite — Catálogo de Autos</title>
</head>
<body>
    <!-- Cambié los <div> principales por etiquetas semánticas -->
    <div class="contenedor">
        
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <img src="./assets/image/logo-car.png" alt="Logo Electro Car" />
                <div class="barra"><i class="fa-solid fa-bars fa-lg"></i></div>
            </div>
            <nav>
                <ul class="menu-principal">
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Catálogo</a></li>
                    <li><a href="#">Ofertas</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>
        </header>

        <!-- ASIDE (Filtro) -->
        <aside class="aside">
            <div>
                <p class="ordenar">Ordenar por</p>
                <div>
                    <select name="search" id="dropdown">
                        <option value="volvo">Volvo</option>
                        <option value="saab">Saab</option>
                        <option value="mercedes">Mercedes</option>
                        <option value="audi">Audi</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- MAIN (Catálogo) -->
        <main class="main">
            <!-- Card 1 -->
            <div class="card">
                <img src="./assets/image/carro8.jpg" alt="Auto Renault" class="card-img" />
                <div class="card-content">
                    <h2 class="card-title">Renault</h2>
                    <p class="card-price">$866.000</p>
                    <button class="card-button">Ver más</button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <img src="./assets/image/carro7.jpg" alt="Auto Renault" class="card-img" />

                </div>
            </div>

            <!-- Card 3 -->

                <img src="./assets/image/carro1.jpg" alt="Auto Renault" class="card-img" />
                <div class="card-content">
                    <h2 class="card-title">Renault</h2>
                    <p class="card-price">$866.000</p>
                    <button class="card-button">Ver más</button>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="card">
                <img src="./assets/image/carro2.jpg" alt="Auto Renault Kwid" class="card-img" />
                <div class="card-content">
                    <h2 class="card-title">Renault Kwid</h2>
                    <p class="card-price">$866.000</p>
                    <button class="card-button">Ver más</button>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="card">
                <img src="./assets/image/carro3.jpg" alt="Auto Renault Kwid" class="card-img" />
                <div class="card-content">
                    <h2 class="card-title">Renault Kwid</h2>
                    <p class="card-price">$866.000</p>
                    <button class="card-button">Ver más</button>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="card">
                <img src="./assets/image/carro4.jpg" alt="Auto Volkswagen" class="card-img" />
                <div class="card-content">
                    <h2 class="card-title">Volkswagen</h2>
                    <p class="card-price">$866.000</p>
                    <button class="card-button">Ver más</button>
                </div>
            </div>

            <!-- Card 7 -->
            <div class="card">
                <img src="./assets/image/carro5.jpg" alt="Auto Fiat" class="card-img" />

                    <h2 class="card-title">Volvo CX5</h2>
                    <p class="card-price">$866.000</p>
                    <button class="card-button">Ver más</button>
                </div>
            </div>

            <!-- Paginación -->
            <div class="contenedor2">
                <ul class="navega">
                    <li><a href="#">&lt;&lt;</a></li>
                    <li><a href="#">1</a></li>
                    <li><a href="#">2</a></li>
                    <li><a href="#">3</a></li>
                    <li><a href="#">&gt;&gt;</a></li>
                </ul>
            </div>

        <footer class="footer">
            <div class="logo2">
                <a class="log-twitter" href="#" target="_blank"><i class="fa-brands fa-square-instagram fa-2x"></i></a>
